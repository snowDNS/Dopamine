
name: StarJail Build

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract StarJail source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="StarJail-source.zip"
          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "Nu găsesc $ZIP_FILE în rădăcina repository-ului."
            ls -la
            exit 1
          fi
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source
          PROJECT_DIR="$(find source -mindepth 1 -maxdepth 2 -type f -name Makefile -print -quit | xargs dirname)"
          if [[ -z "$PROJECT_DIR" || ! -f "$PROJECT_DIR/Makefile" ]]; then
            echo "Nu am găsit Makefile în arhiva ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install build dependencies
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install GNU Make
        shell: bash
        run: |
          brew install make
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> "$GITHUB_ENV"

      - name: Restore source submodules
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          git clone --depth 1 https://github.com/opa334/ChOma BaseBin/ChOma
          git clone --depth 1 https://github.com/opa334/XPF BaseBin/XPF
          git clone --depth 1 https://github.com/opa334/kfd Application/Dopamine/Dopamine/Exploits/kfd/kfd
          git clone --depth 1 https://github.com/opa334/opainject BaseBin/opainject
          git clone --depth 1 https://github.com/opa334/litehook BaseBin/_external/modules/litehook

      - name: Install Theos and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$GITHUB_WORKSPACE/theos"
          mkdir -p "$THEOS"
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos -o install-theos.sh
          bash install-theos.sh
          curl -fL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"
          tar -xJf "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz" -C "$THEOS/sdks"

      - name: Build and install trustcache
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/CRKatri/trustcache "$RUNNER_TEMP/trustcache"
          cd "$RUNNER_TEMP/trustcache"
          export CFLAGS="${CFLAGS:-} -I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="${LDFLAGS:-} -L$(brew --prefix openssl)/lib -arch arm64"
          gmake -j"$(sysctl -n hw.logicalcpu)" OPENSSL=1
          sudo mkdir -p /opt/procursus/bin
          sudo cp trustcache /opt/procursus/bin/

      - name: Download bootstraps
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR/Application/Dopamine/Resources"
          chmod +x download_bootstraps.sh
          bash ./download_bootstraps.sh

      - name: Build StarJail
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          export BASEDIR="$PROJECT_DIR"
          export THEOS="$GITHUB_WORKSPACE/theos"
          chmod +x BaseBin/tar
          gmake -j"$(sysctl -n hw.logicalcpu)" NIGHTLY=0

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarJail-build
          path: |
            source/**/Application/Dopamine.ipa
            source/**/Application/Dopamine.tipa
          if-no-files-found: error
